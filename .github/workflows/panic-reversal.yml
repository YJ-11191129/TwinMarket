name: Offline panic mechanism experiment

on:
  push:
    paths:
      - 'experiments/panic_reversal/**'
      - '.github/workflows/panic-reversal.yml'
  pull_request:
    paths:
      - 'experiments/panic_reversal/**'
      - '.github/workflows/panic-reversal.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r experiments/panic_reversal/requirements_repro.txt
      - run: python -m unittest experiments.panic_reversal.test_framework -v
